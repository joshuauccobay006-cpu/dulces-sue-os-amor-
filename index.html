<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buenas Noches - CAM 11 (Puppet)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #07070a;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Líneas estilo monitor CRT / cámara de seguridad */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.25),
        rgba(0, 0, 0, 0.25) 2px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    .camera-frame {
      border: 2px solid #444;
      width: 90%;
      max-width: 520px;
      padding: 25px;
      background: radial-gradient(circle at center, #14121d 0%, #050508 100%);
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.2);
      text-align: center;
      position: relative;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 20px;
    }

    .rec {
      color: #ff2a2a;
      font-weight: bold;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Máscara de Puppet en CSS puro */
    .puppet-mask {
      width: 140px;
      height: 185px;
      background-color: #f4f4f6;
      border-radius: 50% 50% 45% 45% / 45% 45% 55% 55%;
      margin: 0 auto 25px;
      position: relative;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    /* Ojos negros con pupilas blancas */
    .eye {
      width: 28px;
      height: 36px;
      background-color: #080808;
      border-radius: 50%;
      position: absolute;
      top: 52px;
    }
    .eye.left { left: 26px; }
    .eye.right { right: 26px; }

    .eye::after {
      content: "";
      width: 5px;
      height: 5px;
      background-color: #fff;
      border-radius: 50%;
      position: absolute;
      top: 15px;
      left: 11px;
      box-shadow: 0 0 6px #fff;
    }

    /* Lágrimas moradas */
    .tear {
      width: 10px;
      height: 48px;
      background-color: #7b2cbf;
      position: absolute;
      top: 84px;
      border-radius: 0 0 6px 6px;
    }
    .tear.left { left: 35px; }
    .tear.right { right: 35px; }

    /* Mejillas rojas */
    .cheek {
      width: 24px;
      height: 24px;
      background-color: #d90429;
      border-radius: 50%;
      position: absolute;
      top: 96px;
    }
    .cheek.left { left: 12px; }
    .cheek.right { right: 12px; }

    /* Sonrisa */
    .mouth {
      width: 68px;
      height: 28px;
      border-bottom: 6px solid #080808;
      border-radius: 0 0 50% 50%;
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
    }

    .mouth::before {
      content: "";
      width: 52px;
      height: 16px;
      border-bottom: 4px solid #9d4edd;
      border-radius: 0 0 50% 50%;
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 10px #9d4edd;
      margin-bottom: 10px;
    }

    p {
      font-size: 0.95rem;
      color: #b8b8c8;
      margin-bottom: 22px;
      line-height: 1.4;
    }

    .music-box-container {
      border: 1px solid #5a189a;
      background: #0d0b14;
      padding: 14px;
      border-radius: 6px;
    }

    .music-label {
      font-size: 0.8rem;
      color: #c77dff;
      margin-bottom: 10px;
      display: block;
    }

    audio {
      width: 100%;
      height: 40px;
      filter: invert(90%) hue-rotate(240deg);
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="camera-frame">
    <div class="hud-top">
      <span class="rec">● REC</span>
      <span>CAM 11 - PRIZE CORNER</span>
      <span>12:00 AM</span>
    </div>

    <div class="puppet-mask">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="tear left"></div>
      <div class="tear right"></div>
      <div class="cheek left"></div>
      <div class="cheek right"></div>
      <div class="mouth"></div>
    </div>

    <h1>BUENAS NOCHES</h1>
    <p>No olvides darle cuerda a la caja musical antes de dormir... Dulces sueños.</p>

    <div class="music-box-container">
      <span class="music-label">▶ CAJA MUSICAL (popet.mp3)</span>
      <audio controls loop>
        <source src="popet.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
      </audio>
    </div>
  </div>

</body>
</html>
